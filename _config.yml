# umbrix.khassinx.com — Jekyll config (canon: _template/web/templates/base.html + WEB_PROPERTY_SPEC)
# Nota de ecosistema ACTIVA (decisión de Abraham 2026-07-11: uniformidad en todas las apps propias;
# supera la Decisión #8 de marca independiente — el subdominio y el © KHASSINX LLC ya declaran el parentesco).
show_ecosystem_note: true
title: Umbrix
short_name: Umbrix
description: End-to-end encrypted, Apple-native messaging with zero data collection. No servers, no accounts, no trackers.
url: https://umbrix.khassinx.com
lang: en
locales: [en, es]
schema_type: app
org_legal_name: "KHASSINX LLC"
theme_color_dark: "#0E0E11"
theme_color_light: "#FAFAF7"

# Layer 2 brand tokens (púrpura alineado al AppIcon.icon)
app_tokens_css: /assets/css/umbrix-tokens.css
# Bump para invalidar el cache del edge CF al cambiar CSS (los tokens no tienen scope de purge)
css_version: 20260711

# Share card 1200×630 (track C1 resuelto 2026-07-11: icono redondeado sobre fondo de marca, PIL pipeline BRAND_SYSTEM §6)
og_image: /assets/og/og-image-en.png
org_logo: /assets/favicons/icon-512.png

# Footer — Legal Trust Hub (WEB_PROPERTY_SPEC §10.3) + Support/Contact como páginas:
# Privacy · Terms · Legal · Security · Support · Contact.
# (El layout no tiene header nav; el footer es la navegación del sitio.)
footer_nav:
  en:
    - title: Privacy
      url: /legal/privacy/
    - title: Terms
      url: /legal/terms/
    - title: Legal
      url: /legal/
    - title: Security
      url: /security/
    - title: Support
      url: /support/
    - title: Contact
      url: /contact/
  es:
    - title: Privacidad
      url: /es/legal/privacy/
    - title: Términos
      url: /es/legal/terms/
    - title: Legal
      url: /es/legal/
    - title: Seguridad
      url: /es/security/
    - title: Soporte
      url: /es/support/
    - title: Contacto
      url: /es/contact/

ui_strings:
  en:
    skip_to_main: "Skip to main content"
    last_updated_label: "Last updated"
    footer_label: "Footer"
    language_selector_label: "Language selector"
  es:
    skip_to_main: "Saltar al contenido principal"
    last_updated_label: "Última actualización"
    footer_label: "Pie de página"
    language_selector_label: "Selector de idioma"

markdown: kramdown
plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - .gitignore

# Jekyll por default ignora dotfiles/dotdirs. .well-known DEBE servirse
# (RFC 9116 security.txt requiere path exacto /.well-known/security.txt).
include:
  - .well-known
