name: Build preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter --safe --verbose

      - name: HTML5 validation
        uses: Cyb3r-Jak3/html5validator-action@v8.0.0
        with:
          root: _site/
          log_level: WARNING
